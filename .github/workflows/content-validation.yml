name: Validate managed website content

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Moof site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Build site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Confirm deployable output
        run: |
          test -f dist/index.html
          test -f dist/menu/index.html
