name: Deploy website

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Where should this release be deployed?
        required: true
        default: github-pages
        type: choice
        options:
          - github-pages
          - aws

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.deploy_target || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.target.outputs.deploy_target }}
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.deploy_target || 'github-pages' }}
        run: |
          case "$REQUESTED_TARGET" in
            github-pages|aws) ;;
            *)
              echo "::error::Unknown deployment target: $REQUESTED_TARGET"
              exit 1
              ;;
          esac
          echo "deploy_target=$REQUESTED_TARGET" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            a/package-lock.json
            b/package-lock.json
            c/package-lock.json
            d/package-lock.json
            e/package-lock.json
            f/package-lock.json

      - name: Configure GitHub Pages
        if: steps.target.outputs.deploy_target == 'github-pages'
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve public URL
        id: public-url
        shell: bash
        env:
          DEPLOY_TARGET: ${{ steps.target.outputs.deploy_target }}
          PAGES_SITE: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          AWS_SITE_URL: ${{ vars.AWS_SITE_URL }}
          AWS_BASE_PATH: ${{ vars.AWS_BASE_PATH }}
        run: |
          if [ "$DEPLOY_TARGET" = "aws" ]; then
            if [ -z "$AWS_SITE_URL" ]; then
              echo "::error::AWS_SITE_URL is not configured. Run infra/setup-aws.ps1 first."
              exit 1
            fi
            site_url="$AWS_SITE_URL"
            base_path="$AWS_BASE_PATH"
          else
            site_url="$PAGES_SITE"
            base_path="$PAGES_BASE"
          fi

          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"

      - name: Build site
        shell: bash
        env:
          GITHUB_PAGES_SITE: ${{ steps.public-url.outputs.site_url }}
          GITHUB_PAGES_BASE: ${{ steps.public-url.outputs.base_path }}
        run: |
          mkdir -p site
          cp pages/index.html site/index.html
          touch site/.nojekyll

          for dir in a b c d e f; do
            if [ -f "$dir/package.json" ]; then
              echo "Building design $dir"
              npm --prefix "$dir" ci
              npm --prefix "$dir" run build
              mkdir -p "site/$dir"
              cp -r "$dir/dist/." "site/$dir/"
            fi
          done

          # Not-yet-converted demo sites. Isolated from the client loop above:
          # a failed preprod build is skipped, never aborts the client deploy.
          if [ -d "preprod" ]; then
            for dir in preprod/*/; do
              dir="${dir%/}"
              if [ -f "$dir/package.json" ]; then
                echo "Building preprod demo $dir"
                if npm --prefix "$dir" ci && npm --prefix "$dir" run build; then
                  mkdir -p "site/$dir"
                  cp -r "$dir/dist/." "site/$dir/"
                else
                  echo "::warning::Skipping preprod demo $dir - build failed"
                fi
              fi
            done
          fi

      - name: Generate preprod index
        shell: bash
        run: |
          if [ -d "preprod" ]; then
            mkdir -p site/preprod
            {
              echo "<!doctype html><html><head><meta charset=\"utf-8\"><title>Preprod demos</title>"
              echo "<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem}"
              echo "table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:.5rem .75rem;text-align:left}"
              echo "th{background:#f4f4f4}.status-live{color:#0a7c2f}.status-failed{color:#b3261e}</style></head><body>"
              echo "<h1>Preprod demo sites</h1><p>Generated $(date -u +%Y-%m-%dT%H:%M:%SZ)</p>"
              echo "<table><tr><th>Business</th><th>Brief</th><th>Created</th><th>Status</th><th>Link</th></tr>"
              for dir in preprod/*/; do
                dir="${dir%/}"
                slug="$(basename "$dir")"
                meta="$dir/demo.json"
                name="$slug"
                brief=""
                created=""
                if [ -f "$meta" ]; then
                  name="$(jq -r '.businessName // empty' "$meta")"
                  brief="$(jq -r '.designBrief // empty' "$meta")"
                  created="$(jq -r '.createdDate // empty' "$meta")"
                  [ -z "$name" ] && name="$slug"
                fi
                if [ -f "site/preprod/$slug/index.html" ]; then
                  state="Live"
                  stateClass="status-live"
                  link="<a href=\"./$slug/\">View</a>"
                else
                  state="Build failed"
                  stateClass="status-failed"
                  link=""
                fi
                esc_name="$(printf '%s' "$name" | sed 's/&/\&amp;/g;s/</\&lt;/g')"
                esc_brief="$(printf '%s' "$brief" | sed 's/&/\&amp;/g;s/</\&lt;/g')"
                echo "<tr><td>$esc_name</td><td>$esc_brief</td><td>$created</td><td class=\"$stateClass\">$state</td><td>$link</td></tr>"
              done
              echo "</table></body></html>"
            } > site/preprod/index.html
          fi

      - name: Verify site artifact
        shell: bash
        run: |
          test -f site/index.html
          for dir in a b c d e f; do
            test -f "site/$dir/index.html"
          done

      - name: Upload GitHub Pages artifact
        if: steps.target.outputs.deploy_target == 'github-pages'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Upload AWS artifact
        if: steps.target.outputs.deploy_target == 'aws'
        uses: actions/upload-artifact@v7
        with:
          name: aws-site
          path: site
          include-hidden-files: true
          retention-days: 1

  deploy-pages:
    if: needs.build.outputs.deploy_target == 'github-pages'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aws:
    if: needs.build.outputs.deploy_target == 'aws'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN AWS_REGION AWS_S3_BUCKET AWS_CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: aws-site
          path: site

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: >-
          aws s3 sync site "s3://$AWS_S3_BUCKET"
          --delete
          --only-show-errors
          --cache-control "public,max-age=300,must-revalidate"

      - name: Refresh CloudFront
        env:
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
