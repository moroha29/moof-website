name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            a/package-lock.json
            b/package-lock.json
            c/package-lock.json
            d/package-lock.json
            e/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        shell: bash
        env:
          GITHUB_PAGES_SITE: ${{ steps.pages.outputs.origin }}
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p site
          cp pages/index.html site/index.html
          touch site/.nojekyll

          for dir in a b c d e; do
            if [ -f "$dir/package.json" ]; then
              echo "Building design $dir"
              npm --prefix "$dir" ci
              npm --prefix "$dir" run build
              mkdir -p "site/$dir"
              cp -r "$dir/dist/." "site/$dir/"
            fi
          done

      - name: Verify site artifact
        shell: bash
        run: |
          test -f site/index.html
          for dir in a b c d e; do
            test -f "site/$dir/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
